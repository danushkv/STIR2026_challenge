# Public, portable form of the effective fast_run_with2024_agg configuration.
# Copy .env.example to .env before using a shell driver. Scientific/training
# values match the saved run config; only machine-local paths are externalized.
pseudo_labels_dir: ${oc.env:PSEUDO_LABELS_DIR,./data/pseudo_labels_with_2024_agg}
stir_root: ${oc.env:STIR_TRAIN_ROOT,./data/STIRcombined}
repo_root: ${oc.env:COTRACKER_ROOT,../co-tracker}
checkpoint: ${oc.env:INIT_CKPT,./artifacts/litetracker_finetuned.pth}
skip: 5
out_dir: ${oc.env:RUNS_ROOT,./runs}
model_resolution: [384, 512]

lr: 2.0e-5
epochs: 45
window_len: 16
train_iters: 4
supervision: weighted
max_train_frames: 64
max_points: 384
seed: 0
train_clip_ids: []
max_train_clips: 0

val_patients: []
val_every: 1                  # recorded compatibility key; train.py does no inline eval
val_max_frames: 250           # evaluator key; not used during training

save_freq: 2
num_workers: 4

wandb:
  enabled: true
  project: stir-student
  entity: null
  run_name: fast_run_with2024_agg_repro
  mode: online
