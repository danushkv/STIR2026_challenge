# Config for train.py, shared with every evaluator (they reuse
# model.DEFAULT_CONFIG). Loaded with OmegaConf; every key can be overridden on
# the command line, in either `--key value` or `key=value` form:
#
#   python train.py --config train.yaml \
#       lr=1e-5 epochs=20 wandb.enabled=true val_patients=[15,16]
#
# Required keys are left as ??? (OmegaConf raises if still missing at run time).

# --- Data ---
pseudo_labels_dir: ${oc.env:PSEUDO_LABELS_DIR,./data/pseudo_labels} # run_phase2.py's --out-dir
stir_root: ${oc.env:STIR_TRAIN_ROOT,./data/STIRDataset}      # real frames + start/end centers
# Absolute: scripts are launched from several working directories.
repo_root: ${oc.env:COTRACKER_ROOT,../co-tracker}            # cloned facebookresearch/co-tracker
checkpoint: ${oc.env:INIT_CKPT,./artifacts/scaled_online.pth}
skip: 5                       # must match the --skip used to collect the pseudo-labels
out_dir: ${oc.env:RUNS_ROOT,./runs}
model_resolution: [384, 512]  # CoTracker3's trained working resolution (h, w)

# --- Optimization ---
lr: 2.0e-5
epochs: 10
window_len: 16                # must match the checkpoint's window_len (16 for scaled_online)
train_iters: 4                # refinement iterations per window
supervision: weighted         # weighted | uniform (fold verifier per-frame weight or not)
max_train_frames: 64          # per-clip frame cap (bounds GPU memory); Meta uses 64
max_points: 384               # per-clip query-point cap; Meta uses 384
seed: 0
train_clip_ids: []            # optional exact clip ids, e.g. [0__left__seq00]
max_train_clips: 0            # 0 = all; deterministic sorted prefix for smoke tests

# --- Validation-related compatibility keys ---
# train.py only uses val_patients to exclude data. Evaluation is a separate
# eval_sweep.py command; val_every is retained because it appears in old saved
# run configs, and val_max_frames is read by the standalone evaluators.
val_patients: []              # patient folders excluded from training
val_every: 1                  # legacy recorded key; no inline validation in train.py
val_max_frames: 250           # evaluator frame cap; not used by train.py

# --- Checkpointing ---
save_freq: 1                  # save a numbered checkpoint every N epochs (student_last.pth always saved)

# --- Logging ---
wandb:
  enabled: true
  project: stir-student
  entity: null
  run_name: null
  mode: online                # online | offline | disabled

# --- train.py only ---
num_workers: 4                 # DataLoader worker processes for the prefetching pipeline
